<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og-card source</title>
<!-- Source for og-card.png. Regenerate with:
     chrome --headless --screenshot=assets/og-card.png --window-size=1200,630 \
            --virtual-time-budget=12000 file://.../assets/og-card.html -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;900&family=JetBrains+Mono:wght@400;500;700&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #F7F4EC; font-family: "Source Sans 3", sans-serif; color: #211D18;
    display: flex; align-items: center; gap: 56px; padding: 0 64px;
  }
  .left { flex: 1; }
  .kicker {
    font-family: "JetBrains Mono", monospace; font-size: 13px; font-weight: 500;
    letter-spacing: 0.18em; color: #57534E; display: flex; align-items: center; gap: 10px;
  }
  .kicker i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
  .hands-on { color: #9A3412; font-weight: 700; font-size: 24px; letter-spacing: 0.24em; margin: 26px 0 2px; }
  h1 { font-weight: 900; font-size: 74px; letter-spacing: -0.028em; line-height: 1; margin-bottom: 18px; }
  .sub { font-size: 26px; font-weight: 600; line-height: 1.25; margin-bottom: 20px; }
  .author { font-size: 22px; font-weight: 700; margin-bottom: 30px; }
  .bars { display: flex; flex-direction: column; gap: 11px; width: 470px; }
  .bar { height: 13px; border-radius: 6px; background: #9A3412; }
  .bar.short { width: 72%; }
  .tokens { display: flex; gap: 9px; }
  .tokens i { height: 13px; border-radius: 5px; display: inline-block; }
  .meta { font-family: "JetBrains Mono", monospace; font-size: 13.5px; color: #57534E; margin-top: 22px; }
  .cover { flex-shrink: 0; }
  .cover img { height: 520px; display: block; border-radius: 4px; box-shadow: 0 18px 44px rgba(33,29,24,.25); }
</style>
</head>
<body>
  <div class="left">
    <p class="kicker">A LAB-FIRST GUIDE TO LLM INTERPRETABILITY <i style="background:#0D9488"></i><i style="background:#9A3412"></i><i style="background:#F59E0B"></i></p>
    <p class="hands-on">HANDS-ON</p>
    <h1>Explainable AI</h1>
    <p class="sub">Interpreting, Evaluating, and<br>Trusting Large Language Models</p>
    <p class="author">Hadi Mohammadi</p>
    <div class="bars">
      <div class="bar"></div>
      <div class="tokens">
        <i style="width:60px;background:#A9D9D1"></i>
        <i style="width:88px;background:#6FBFB4"></i>
        <i style="width:40px;background:#0D9488"></i>
        <i style="width:70px;background:#F59E0B"></i>
        <i style="width:92px;background:#A9D9D1"></i>
      </div>
      <div class="bar short"></div>
    </div>
    <p class="meta">13 chapters · 13 runnable Colab labs · every number from an executed run</p>
  </div>
  <div class="cover"><img src="cover-front.png" alt=""></div>
</body>
</html>
